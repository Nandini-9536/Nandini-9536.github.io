<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="quizBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    <linearGradient id="laravelRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2d20" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" fill="url(#quizBg)" />
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.1">
    <path d="M 0,60 L 800,60 M 0,120 L 800,120 M 0,180 L 800,180 M 0,240 L 800,240 M 0,300 L 800,300 M 0,360 L 800,360 M 0,420 L 800,420" stroke="#a855f7" stroke-width="1" />
    <path d="M 100,0 L 100,480 M 200,0 L 200,480 M 300,0 L 300,480 M 400,0 L 400,480 M 500,0 L 500,480 M 600,0 L 600,480 M 700,0 L 700,480" stroke="#a855f7" stroke-width="1" />
  </g>

  <!-- Glowing Accent Orbs -->
  <circle cx="680" cy="90" r="120" fill="#ff2d20" opacity="0.25" filter="url(#glow)" />
  <circle cx="120" cy="380" r="140" fill="#6366f1" opacity="0.2" filter="url(#glow)" />

  <!-- Main Mockup Container Card -->
  <rect x="70" y="45" width="660" height="390" rx="16" fill="url(#cardGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
  
  <!-- Browser-style Top Bar -->
  <rect x="70" y="45" width="660" height="42" rx="16" fill="rgba(15, 23, 42, 0.7)" />
  <circle cx="95" cy="66" r="6" fill="#ef4444" />
  <circle cx="115" cy="66" r="6" fill="#f59e0b" />
  <circle cx="135" cy="66" r="6" fill="#10b981" />
  
  <!-- URL Pill -->
  <rect x="230" y="54" width="340" height="24" rx="12" fill="rgba(255, 255, 255, 0.08)" />
  <text x="400" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">localhost:8000/quiz/dashboard</text>

  <!-- Laravel Logo & Badge -->
  <rect x="100" y="105" width="120" height="32" rx="8" fill="url(#laravelRed)" />
  <text x="160" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">LARAVEL 10</text>

  <rect x="230" y="105" width="85" height="32" rx="8" fill="rgba(99, 102, 241, 0.25)" stroke="#6366f1" stroke-width="1" />
  <text x="272" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#a5b4fc" text-anchor="middle">PHP 8.2</text>

  <rect x="325" y="105" width="95" height="32" rx="8" fill="rgba(14, 165, 233, 0.25)" stroke="#0ea5e9" stroke-width="1" />
  <text x="372" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#7dd3fc" text-anchor="middle">MySQL DB</text>

  <!-- Quiz Interface Mockup Inside -->
  <!-- Left Column: Quiz Progress & Stats -->
  <rect x="100" y="155" width="180" height="250" rx="12" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(255, 255, 255, 0.08)" />
  
  <text x="120" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#f8fafc">Live Test Session</text>
  <text x="120" y="205" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Timer Remaining</text>
  <text x="120" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#38bdf8">18:42</text>

  <!-- Questions Matrix Grid -->
  <text x="120" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Question Navigator</text>
  <g transform="translate(120, 285)">
    <rect x="0" y="0" width="26" height="26" rx="5" fill="#10b981" />
    <text x="13" y="17" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">1</text>
    <rect x="34" y="0" width="26" height="26" rx="5" fill="#10b981" />
    <text x="47" y="17" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">2</text>
    <rect x="68" y="0" width="26" height="26" rx="5" fill="#6366f1" />
    <text x="81" y="17" font-size="11" fill="#fff" text-anchor="middle" font-weight="bold">3</text>
    <rect x="102" y="0" width="26" height="26" rx="5" fill="rgba(255, 255, 255, 0.1)" />
    <text x="115" y="17" font-size="11" fill="#94a3b8" text-anchor="middle">4</text>

    <rect x="0" y="34" width="26" height="26" rx="5" fill="rgba(255, 255, 255, 0.1)" />
    <text x="13" y="51" font-size="11" fill="#94a3b8" text-anchor="middle">5</text>
    <rect x="34" y="34" width="26" height="26" rx="5" fill="rgba(255, 255, 255, 0.1)" />
    <text x="47" y="51" font-size="11" fill="#94a3b8" text-anchor="middle">6</text>
    <rect x="68" y="34" width="26" height="26" rx="5" fill="rgba(255, 255, 255, 0.1)" />
    <text x="81" y="51" font-size="11" fill="#94a3b8" text-anchor="middle">7</text>
    <rect x="102" y="34" width="26" height="26" rx="5" fill="rgba(255, 255, 255, 0.1)" />
    <text x="115" y="51" font-size="11" fill="#94a3b8" text-anchor="middle">8</text>
  </g>

  <!-- Right Question Container -->
  <rect x="300" y="155" width="400" height="250" rx="12" fill="rgba(30, 41, 59, 0.6)" stroke="rgba(255, 255, 255, 0.08)" />
  
  <text x="325" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f43f5e">Question 3 of 10 • Web Engineering</text>
  <text x="325" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">Which PHP superglobal is used to collect form data?</text>
  
  <!-- Option A -->
  <rect x="325" y="240" width="350" height="32" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
  <circle cx="342" cy="256" r="6" stroke="#94a3b8" stroke-width="1.5" fill="none" />
  <text x="360" y="261" font-family="monospace" font-size="12" fill="#cbd5e1">A) $_GET and $_POST</text>

  <!-- Option B (Selected/Active) -->
  <rect x="325" y="280" width="350" height="32" rx="6" fill="rgba(99, 102, 241, 0.2)" stroke="#6366f1" stroke-width="1.5" />
  <circle cx="342" cy="296" r="6" fill="#6366f1" />
  <circle cx="342" cy="296" r="2.5" fill="#fff" />
  <text x="360" y="301" font-family="monospace" font-size="12" fill="#a5b4fc" font-weight="600">B) $_REQUEST and $_POST</text>

  <!-- Option C -->
  <rect x="325" y="320" width="350" height="32" rx="6" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.1)" />
  <circle cx="342" cy="336" r="6" stroke="#94a3b8" stroke-width="1.5" fill="none" />
  <text x="360" y="341" font-family="monospace" font-size="12" fill="#cbd5e1">C) $_SERVER</text>

  <!-- Next / Submit Button -->
  <rect x="575" y="362" width="100" height="30" rx="6" fill="url(#laravelRed)" />
  <text x="625" y="382" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Next &gt;</text>

</svg>
