<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%">
  <defs>
    <linearGradient id="pyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091428" />
      <stop offset="50%" stop-color="#0d2137" />
      <stop offset="100%" stop-color="#0a3242" />
    </linearGradient>
    <linearGradient id="pyYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="pyBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <rect width="800" height="480" fill="url(#pyBg)" />
  
  <!-- Subtle Grid -->
  <g opacity="0.08">
    <path d="M 0,60 L 800,60 M 0,120 L 800,120 M 0,180 L 800,180 M 0,240 L 800,240 M 0,300 L 800,300 M 0,360 L 800,360 M 0,420 L 800,420" stroke="#38bdf8" stroke-width="1" />
    <path d="M 100,0 L 100,480 M 200,0 L 200,480 M 300,0 L 300,480 M 400,0 L 400,480 M 500,0 L 500,480 M 600,0 L 600,480 M 700,0 L 700,480" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Left: Digital Clock Tkinter App -->
  <g transform="translate(60, 60)">
    <!-- App Window Frame -->
    <rect width="320" height="350" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
    <rect width="320" height="36" rx="14" fill="#1e293b" />
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" />
    <circle cx="52" cy="18" r="5" fill="#10b981" />
    <text x="160" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Tkinter - Digital Clock.py</text>
    
    <!-- Clock Display Screen -->
    <rect x="25" y="75" width="270" height="150" rx="10" fill="#020617" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1" />
    <text x="160" y="115" font-family="'Courier New', Courier, monospace" font-size="13" fill="#38bdf8" text-anchor="middle" letter-spacing="3">SYSTEM TIME</text>
    <text x="160" y="170" font-family="'Courier New', Courier, monospace" font-size="34" font-weight="bold" fill="#38bdf8" text-anchor="middle">10:45:28 PM</text>
    <text x="160" y="200" font-family="'Courier New', Courier, monospace" font-size="13" fill="#64748b" text-anchor="middle">OCTOBER 2024 • LIVE GUI</text>
    
    <!-- Badges -->
    <rect x="25" y="255" width="125" height="30" rx="6" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1" />
    <text x="87" y="275" font-family="sans-serif" font-size="11" font-weight="600" fill="#7dd3fc" text-anchor="middle">Tkinter &amp; Time</text>

    <rect x="165" y="255" width="130" height="30" rx="6" fill="rgba(251, 191, 36, 0.15)" stroke="#fbbf24" stroke-width="1" />
    <text x="230" y="275" font-family="sans-serif" font-size="11" font-weight="600" fill="#fde68a" text-anchor="middle">Internpe Project</text>
  </g>

  <!-- Right: Virtual Dice Simulator Tkinter App -->
  <g transform="translate(420, 60)">
    <!-- App Window Frame -->
    <rect width="320" height="350" rx="14" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5" />
    <rect width="320" height="36" rx="14" fill="#1e293b" />
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" />
    <circle cx="52" cy="18" r="5" fill="#10b981" />
    <text x="160" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Tkinter - Dice Simulator.py</text>
    
    <!-- Dice Graphics -->
    <g transform="translate(110, 80)">
      <!-- 3D-ish Dice Face -->
      <rect x="0" y="0" width="100" height="100" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="3" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.4))" />
      <!-- Dots for 5 -->
      <circle cx="25" cy="25" r="7" fill="#0f172a" />
      <circle cx="75" cy="25" r="7" fill="#0f172a" />
      <circle cx="50" cy="50" r="7" fill="#ef4444" />
      <circle cx="25" cy="75" r="7" fill="#0f172a" />
      <circle cx="75" cy="75" r="7" fill="#0f172a" />
    </g>

    <!-- Roll Button -->
    <rect x="80" y="210" width="160" height="38" rx="8" fill="url(#pyYellow)" />
    <text x="160" y="234" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">🎲 ROLL DICE</text>

    <!-- Badges -->
    <rect x="35" y="275" width="115" height="30" rx="6" fill="rgba(251, 191, 36, 0.15)" stroke="#fbbf24" stroke-width="1" />
    <text x="92" y="295" font-family="sans-serif" font-size="11" font-weight="600" fill="#fde68a" text-anchor="middle">Random Module</text>

    <rect x="165" y="275" width="120" height="30" rx="6" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1" />
    <text x="225" y="295" font-family="sans-serif" font-size="11" font-weight="600" fill="#7dd3fc" text-anchor="middle">GUI Animations</text>
  </g>
</svg>
